services:
  - type: web
    name: documentacion-automatica
    runtime: python
    plan: free

    buildCommand: |
      apt-get update
      apt-get install -y graphviz libreoffice python3-uno
      pip install -r requirements.txt

    startCommand: |
      uvicorn oic_doc_generator.main:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11