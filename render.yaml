services:
  - type: web
    name: documentacion-automatica
    runtime: python
    plan: free

    buildCommand: |
      apt-get update
      apt-get install -y graphviz 
      pip install -r requirements.txt

    startCommand: |
      uvicorn oic_doc_generator.main:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Clave de Google AI Studio; se rellena en el panel de Render.
      - key: GEMINI_API_KEY
        sync: false

      # Para varios proveedores: crea un Secret File llamado
      # ia_proveedores.json (Render lo monta en /etc/secrets/),
      # o define GROQ_API_KEY, CEREBRAS_API_KEY, etc.
